<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Dragon's Archive</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f6f2ee;font-family:Georgia,serif;background:#05070d;overflow-x:hidden}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}.p{position:absolute;animation:float linear infinite;opacity:.55}
.wrap{position:relative;z-index:1;max-width:1120px;margin:auto;padding:30px 18px 70px}
header{text-align:center;padding:10px 0 28px}.crest{font-size:62px}h1{font-size:clamp(36px,7vw,72px);margin:4px 0;letter-spacing:3px}.sub{color:#c3bfca;font-style:italic}
.archive{padding:24px;border:1px solid #657086;border-radius:30px;background:#090d16ed;box-shadow:0 30px 100px #000c;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:170px;border:1px solid #68758a;border-radius:22px;color:#fff;padding:23px 15px;cursor:pointer;font:inherit;transition:.3s;box-shadow:inset 0 0 55px #0004;position:relative;overflow:hidden}.card:hover{transform:translateY(-7px);box-shadow:0 18px 45px #000a;border-color:#e0e0e0}.card span{display:block;font-size:44px;margin-bottom:13px}.card b{display:block;font-size:17px;line-height:1.3}.card small{display:block;color:#b1b7c2;margin-top:13px;font-size:10px;letter-spacing:1px}
.birthday{background:radial-gradient(circle,#641c2b,#11101a 65%)}.orange{background:radial-gradient(circle,#8b4d15,#11100c 65%)}.mystery{background:radial-gradient(circle,#3b4357,#10131d 65%)}.food{background:radial-gradient(circle,#6b3b20,#15100e 65%)}.morning{background:linear-gradient(150deg,#46536d,#665153,#111522)}.term{background:radial-gradient(circle,#294257,#0d1721 65%)}.secret{background:radial-gradient(circle,#50334d,#14101a 65%)}.jewelry{background:radial-gradient(circle,#284574,#090f1f 65%)}.sad{background:linear-gradient(150deg,#1c2a3a,#0b111b)}.fight{background:radial-gradient(circle,#51323a,#121018 65%)}.sick{background:radial-gradient(circle,#4d4955,#11121a 65%)}.home{background:linear-gradient(140deg,#425252,#0b1015)}.sleep{background:radial-gradient(circle,#293f6d,#09101f 65%)}.motivation{background:radial-gradient(circle,#80381f,#160c09 65%)}.future{background:radial-gradient(circle,#2b354d,#080d16 65%)}
.letter{display:none;max-width:850px;margin:auto;padding:32px;border:1px solid #737d91;border-radius:26px;line-height:1.9;box-shadow:0 30px 100px #000b;animation:open .45s ease}.letter.show{display:block}.head{text-align:center;border-bottom:1px solid #ffffff22;padding-bottom:22px;margin-bottom:25px}.head div{font-size:55px}.head h2{margin:7px 0;font-size:clamp(24px,4vw,36px)}.body{font-size:18px;color:#eee9e8}.choices{display:grid;gap:13px;margin:25px 0}.choice,.close{border:1px solid #7b8496;border-radius:13px;background:#172235;color:#fff;padding:13px 18px;cursor:pointer;font:inherit}.choice:hover,.close:hover{background:#263650;transform:translateY(-2px)}.close{display:block;margin:28px auto 0}.processing{text-align:center;padding:30px;color:#c5cad3;font-style:italic}.dots{font-size:25px;letter-spacing:6px;animation:pulse 1s infinite}.lock{text-align:center;padding:25px}.lock .big{font-size:75px}.date{letter-spacing:2px;color:#d3d7df}.footer{text-align:center;color:#818b9d;font-size:12px;margin-top:22px}
@keyframes float{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}@keyframes open{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.3}}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.letter{padding:24px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.archive{padding:14px}.body{font-size:17px}}
</style>
</head>
<body>
<div id="particles"></div>
<div class="wrap">
<header><div class="crest">🐉 🔥</div><h1>THE DRAGON'S ARCHIVE</h1><div class="sub">A little part of the Phoenix, waiting for the Dragon.</div></header>
<main class="archive">
<div id="grid" class="grid"></div>
<section id="letter" class="letter"></section>
<div class="footer">SEALED WITH A LITTLE CHAOS, A LOT OF HEART, AND ONE PHOENIX 🦅</div>
</main>
</div>
<script>
const titles=[
"OPEN RIGHT NOW!!!","AFTER OPENING THE FIRST MESSAGE","WHEN U GET CURIOUS ABT HOW I LOOK",
"OPEN IF U MISS ME WHILE EATING","OPEN ON UR BDAY MORNING","OPEN WHEN UR TERM STARTS",
"OPEN IF U WANT TO KNOW ABOUT MY DEEPEST SECRET","OPEN TO KNOW A FUN FACT ABT ME","OPEN IF U ARE SAD",
"OPEN IF WE HAD A FIGHT","WHEN U ARE SICK","WHEN U REALLY MISS HOME VERY BADLY","WHEN U CAN’T SLEEP",
"IF U NEED MOTIVATION","OPEN ON YOUR NEXT BDAY — 9 SEPTEMBER 2027"];
const icons=["❤️","🍊","👀","🍱","🌅","📚","🤫","💍","🫂","⚔️","💊","🏠","🌙","🔥","⏳"];
const themes=["birthday","orange","mystery","food","morning","term","secret","jewelry","sad","fight","sick","home","sleep","motivation","future"];
const msgs=[
`HAPPY BIRTHDAY MY PRINCESS.......❤️❤️❤️ I made this for you so that whenever u feel something, or u want someone to be with you in anyway, A little part of me can be with you....yeah so once again, Happiest Birthday Dragon... 🔥<br><br>So...Explore my gift a lil bit.....i really had to learn lots of stuffffs to make this for you.....😭and This is what my heart / soul was screaming to tell you but my brain stopped it for THIS MOMENT!! or else the surprise would have ruined.....😭🤧<br><br>ALSO PROMISE ME U WILL OPEN THIS WHENEVER U NEED ME OKAY???? ONLY THEN!!!! DONOT READ ALL IN JUST ONE DAY OR IT WONT BE WORTH IT 😭.......PROMISE??🥺.....<br><br>(by the u can open two or three now, i have made it such that this is not the only message u open now 😉)`,
`so......I made this for the guy who literally sacrified his sleep for me...😭😭😭🤧🤧🤧omg...... u cared enough to stay awake because talking to me mattered to you, and that genuinely touched me. it's making me emotional 😭 , u are seriously something else Ahmed.... maybe one day i'll call u at night 3 am (uk time) and ask, is orange called as an orange becoz it is orange or is orange called as orange because its like orange??😉 would u still answer me then😏<br><br>but seriously,<br>thank you.....🥺`,
`I knew u were gonna open this 👀.....tbh, Im sorry....i lied. Im actually a very short and dark Man, i was attracted by you......im gay... maybe u will like me back princess, i have really long beard nihahahahaha.......<br><br>(HAHAHAHAHAHA you actually opened this expecting to learn how I look 😭😭😭 GOT YOU)`,
`heyyyyyy......What's that??? why aren't u sharing it???? (STARES at the food for soooo longgg) give me....i want it. i said, GIVEEEEEEEEEE MEEEEEE!!!!!!!!!!<br><br>wont you..........?🥺`,
`My princess woke up!!!!! good morning!!❤️❤️......had good sleep?? aww....look at how cutie u look after waking up from bed 😭......Bday morning huh??? i really wish I could just celebrate it with you from morning till night,(unfortunately🤧.....) BUT ONE DAY WE WILL!!! just gotta trust😉, now go, live this day, and try not to miss me too much ❤️❤️❤️`,
`Heyyyyyyyyy.......so your term is starting now huh?? ALL THE BESTTTTTTT❤️❤️❤️ I have a feeling its gonna a different experience fr. Im sure u will make it, and I hope u get some proper friends.....Imagine u enter your classroom and u are that one main character from k drama💀. Also if anyone troubles u, don't let them walk away, stand up for yourself, or stay quiet ( only if necessary...) or tell them abt me, they will start shaking 😈`,
`yeah so.......i wanted to tell you about my first love.........remember the Cindrella skit i told u abt??? yeah so i had a dance partner with whom i used to practice my moves anoll......and i really liked practicing like that....i even went upto my mom and said, "he's my prince". I know u are boiling right now and I also have a feeling that u are turning into a kettle now, so....yeah this was the truth, and fr, the first love of my life was that red suitcase, i used to hold the handle and practice, i knew u told me not to bring it up again,but im sorry i needed some ideas to write....sorry cutie pie princess....dont be mad at your xium. okay cutiepie???? (sent u invisible hearts so u arent mad again my princess.)`,
`u wanna know.........??? really..............😏??? should i tell ya ??? okay so the fun fact is...(actually its so stupid, i wanted to tell u coz im currently having a ring infront of me) i love rings.....like so much.......but i only like to collect them. like.....i love rings but wont wear em,just keep em in my collection, especially love the deep blue ones with small white crystals ..and bracelets are the only ones that i wear that too only if it looks cool. Hate bangles a lot. also...love ice cream, lava cake and waffles!!!(craving it...🤧)`,
`u okay princess.........?? no?? what's making you sad huh?? its alright..... close your eyes, take a deep breath in and breath out, again, breath in, breathe out. it happens okay?? just don't keep thinking about it, let it go..... what ever happens is not our control....maybe u have a very good tomorrow?? just make the sadness sad and be happy.....let go whatever happened, hope u have a very good tomorrow cutie❤️`,
`so....we fought?? u think it's the end?? definitely no right????😂.....okay maybe we had problems understanding each other again?? but whatever it is...even if the future me does'nt ask, im asking, SORRYYYYYY....... talk to me again, or if i blocked, i will myself. to be honest, ill tell u a secret...👀if we both have fought, then seriously, it's not only you.....I would be thinking abt you the whole damn day too!! like, im gonna go crazy and it's gonna come in my head again and again...like a never ending loop..🥺 so.......shall we forget everything and leave it behind?? help from the past Sana : and if I was the one who was angry........well, just tell me some sweet words which comes genuinely from ur heart.....ill melt especially call me Xium😜.`,
`Princess..... sick?? Ate something or not??? got any tablets??? if u have a sore throat, drink hot water.... and rest for real...if u feel sleepy, sleep!! take rest and you will get better okay??? dont worry....i will use my healing powers to heal u ...... "Allahumma Rabban-nas, adhhibil-ba'sa, ishfi anta Ash-Shafi, la shifa'a illa shifa'uka, shifa'an la yughadiru saqama" ✨✨✨✨✨,I hope you feel better soon, princess😉take care ❤️`,
`Missing home??? its okay..... I know its not easy....settling in a new country, it will take sometime....i know u really wanna go back but.... remember why u came here?? don't regret it, turn it into a fuel, talk to your loved ones, feel peace thinking abt ur home.... but don't stick onto the fact that u wanna just go back....it's not that easy right?? it's okay , gonna be for a few months,...... take care ❤️`,
`dont stress yourself too much....be tension free, have no thoughts.....if u want,take a hot bath...i get sleep instantly when i take hot baths at night....if u have it, turn on the ac, change to your boxers .... and just flop on the bed!! stretch wideee.....like literally stretch wide while lying flat on the bed, and off alll the lights!!!! close your eyes, be stress free, (think abt me if u want,😜) and shut your eyes...no thinking, or maybe think u are lying in a open field with nobody around, and u have absolutely nothing to do...(try yt/spotify asmr if u want) Sleep....goodnight princess❤️`,
`Feeling low?? u know something?? you are not my princess.....you are a warrrior❤️‍🔥....... GO WIN THAT BATTLE.....ill always be on your side 😌 !!!<br><br>and u will win it, i know 😉.`,
`Wowwwww........been a year huh??? or did u open it early 👀??? Im realllyyy not sure what happened to u after a year, what happened to me after a year, what happened to us after a year, but...... even if I didn't wish u this year.....the one from 2026 is wishing you.....HAPPY BIRTHDAY MY PRINCESSS!!!! wow........look at you......my princess is finally 20...🥹 and im 18 right???omgggggg😭😭....<br><br>for real....i'm very curious.....what happened between us in this one year??? are we the same?? changed?? fought??? did we stop talking to each other or what??? omg......damn, im getting stressed now......😭😭😭😭😭what college did I get in?? what course did i get?? am i in hostel?? or am i at home??? WHERE AM I ?? WHERE ARE YOU?? AND WHAT ABOUT EVERYTHING BETWEEN US?????😭😭😭😭 and..........did u finally tell me the meaning of Xium???😭<br><br>Also....... I'm not sure but... you're the only one who has made me feel this special. And honestly... I think I might have feelings for you, Ahmed. 🥺❤️<br><br>damn...2027 feels like a serious year..... and you?? still training?? still eating well?? are u okay??? are we okay??? god...........feels like typing into the future....okay...HAPPY BIRTHDAY ONCE AGAIN DRAGON / MY PRINCESS🤧....i hope i actually wished u in 2027...and hope u actually opened this on 2027 next year...but even if forget, well....the questions remain the same.....TAKE CAREEEE!!!!!!!❤️`
];
const choices={
1:[["🍊 Because it is orange","dont act like Einstein 😏"],["🧠 Because it is called orange","u need immediate brain surgery 💀"]],
3:[["🍽️ SHARE MY FOOD","u are sharing??? how sweet of u, i also want ice cream, biriyani, kfc chicken, mutton, paneer and pizza."],["😈 NO","what did u just say?? no???huh. im not asking you......give meeeeeeeeeeeeeeeeeeee!!!!!!!"]],
9:[["😤 I'M STILL ANGRY","come on.........🥺"],["🥺 I WON'T LET YOU GO","my good boy......."],["❤️ I DON'T KNOW","follow your heart ❤️"]]
};
const grid=document.getElementById("grid"),box=document.getElementById("letter");
grid.innerHTML=titles.map((t,i)=>`<button class="card ${themes[i]}" onclick="openMsg(${i})"><span>${icons[i]}</span><b>${t}</b><small>${i===14?"SEALED • 09 SEP 2026":"OPEN WHEN YOU NEED IT"}</small></button>`).join("");
function particles(t){let a=document.getElementById("particles");a.innerHTML="";let s=t==="orange"?["🍊","•"]:t==="birthday"?["✦","🔥"]:t==="future"?["✦","🔒"]:["✦","•"];for(let i=0;i<24;i++){let x=document.createElement("span");x.className="p";x.textContent=s[i%s.length];x.style.left=Math.random()*100+"%";x.style.fontSize=8+Math.random()*18+"px";x.style.animationDuration=7+Math.random()*13+"s";x.style.animationDelay=-Math.random()*12+"s";a.appendChild(x)}}
function head(i){return `<div class="head"><div>${icons[i]}</div><h2>${titles[i]}</h2></div>`}
function closeBtn(){return `<button class="close" onclick="closeMsg()">↩ Back to the archive</button>`}
function openMsg(i){grid.style.display="none";box.className="letter show "+themes[i];particles(themes[i]);if(i===14&&new Date()<new Date("2027-09-09T00:00:00")){box.innerHTML=head(i)+`<div class="lock"><div class="big">🔒</div><h3>THE FINAL LETTER</h3><p class="date">SEALED • 09 SEPTEMBER 2026</p><p>UNLOCKS • 09 SEPTEMBER 2027</p><p><em>Some messages aren't meant for today.</em></p></div>`+closeBtn()}else if(choices[i]){box.innerHTML=head(i)+`<div class="body">${msgs[i]}</div><div class="choices">${choices[i].map((c,n)=>`<button class="choice" onclick="choose(${i},${n})">${c[0]}</button>`).join("")}</div>`+closeBtn()}else{box.innerHTML=head(i)+`<div class="body">${msgs[i]}</div>`+closeBtn()}box.scrollIntoView({behavior:"smooth"})}
function choose(i,n){let c=choices[i][n];box.innerHTML=head(i)+`<div class="processing">The Dragon has chosen... 👀<div class="dots">•••</div></div>`;setTimeout(()=>box.innerHTML=head(i)+`<div class="body">${c[1]}</div>`+closeBtn(),850)}
function closeMsg(){box.className="letter";grid.style.display="grid";particles("archive");scrollTo({top:0,behavior:"smooth"})}
particles("archive");
</script>
</body>
</html>
